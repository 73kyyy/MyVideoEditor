name: NexClip Build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
env:
  ANDROID_NDK_VERSION: "26.1.10909125"
  JAVA_VERSION: "17"
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        flavor: [free]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk 2>/dev/null || true
          sudo rm -rf /usr/share/dotnet 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install NDK
        run: |
          sdkmanager "ndk;${{ env.ANDROID_NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV
      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> local.properties
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Cache third-party libs
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/third_party
          key: tp-v3-${{ runner.os }}
          restore-keys: tp-v3-${{ runner.os }}-
      - name: Link security Kotlin files
        run: |
          mkdir -p app/src/main/java/com/myvideo/editor/security
          if [ -d "core/security/src/main/java" ]; then
            find core/security/src/main/java -name "*.kt" -type f | while read f; do
              fn=$(basename "$f")
              if [ ! -f "app/src/main/java/com/myvideo/editor/security/$fn" ]; then
                cp "$f" "app/src/main/java/com/myvideo/editor/security/$fn"
              fi
            done
          fi
      - name: Build OpenSSL for Android
        run: |
          set -e
          if [ -f "app/src/main/cpp/openssl/include/openssl/ssl.h" ] && \
             [ -f "app/src/main/cpp/openssl/arm64-v8a/libcrypto.a" ]; then
            echo "OpenSSL已存在，跳过"
            exit 0
          fi
          wget -q https://github.com/openssl/openssl/releases/download/openssl-3.2.1/openssl-3.2.1.tar.gz
          tar -xzf openssl-3.2.1.tar.gz
          cd openssl-3.2.1
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
          TC=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64
          export PATH=$TC/bin:$PATH
          export AR=llvm-ar
          export RANLIB=llvm-ranlib
          export CC=aarch64-linux-android26-clang
          export CXX=aarch64-linux-android26-clang++
          ./Configure android-arm64 no-shared no-tests no-asm no-engine -D__ANDROID_API__=26
          make -j$(nproc)
          mkdir -p ../app/src/main/cpp/openssl/include/openssl
          cp -rL include/openssl/* ../app/src/main/cpp/openssl/include/openssl/
          mkdir -p ../app/src/main/cpp/openssl/arm64-v8a
          cp libcrypto.a ../app/src/main/cpp/openssl/arm64-v8a/
          cp libssl.a ../app/src/main/cpp/openssl/arm64-v8a/
          make clean 2>/dev/null || true
          export CC=armv7a-linux-androideabi26-clang
          export CXX=armv7a-linux-androideabi26-clang++
          ./Configure android-arm no-shared no-tests no-asm no-engine -D__ANDROID_API__=26
          make -j$(nproc)
          mkdir -p ../app/src/main/cpp/openssl/armeabi-v7a
          cp libcrypto.a ../app/src/main/cpp/openssl/armeabi-v7a/
          cp libssl.a ../app/src/main/cpp/openssl/armeabi-v7a/
          cd ..
          echo "=== Verify OpenSSL ==="
          echo "Header count: $(find app/src/main/cpp/openssl/include/openssl -name '*.h' | wc -l)"
          for f in ssl.h evp.h sha.h; do
            if [ -f "app/src/main/cpp/openssl/include/openssl/$f" ]; then
              echo "OK: $f"
            else
              echo "FAIL: $f missing"
              exit 1
            fi
          done
          if [ -f "app/src/main/cpp/openssl/include/openssl/hkdf.h" ]; then
            echo "OK: hkdf.h"
          else
            echo "FAIL: hkdf.h missing"
            exit 1
          fi
          for f in arm64-v8a/libcrypto.a arm64-v8a/libssl.a armeabi-v7a/libcrypto.a armeabi-v7a/libssl.a; do
            if [ -f "app/src/main/cpp/openssl/$f" ]; then
              echo "OK: $f ($(du -h app/src/main/cpp/openssl/$f | cut -f1))"
            else
              echo "FAIL: $f missing"
              exit 1
            fi
          done
      - name: Download opencv-mobile
        run: |
          mkdir -p app/src/main/cpp/third_party/opencv-mobile
          if [ -d "app/src/main/cpp/third_party/opencv-mobile/sdk" ]; then exit 0; fi
          D=0
          for T in v2.5 v2.4 v2.3; do
            for V in 4.10.0 4.9.0 4.8.0; do
              U="https://github.com/nihui/opencv-mobile/releases/download/$T/opencv-mobile-$V-android-sdk.zip"
              if curl -L -f -o cv.zip "$U" --connect-timeout 15 --max-time 120 2>/dev/null; then
                if unzip -t cv.zip >/dev/null 2>&1; then
                  unzip -q cv.zip -d app/src/main/cpp/third_party/opencv-mobile/
            mv app/src/main/cpp/third_party/opencv-mobile/opencv-mobile-*-android-sdk/sdk app/src/main/cpp/third_party/opencv-mobile/sdk 2>/dev/null || true
                  D=1; break 2
                fi
              fi
              rm -f cv.zip
            done
          done
          if [ "$D" -eq 0 ]; then
            echo "opencv-mobile 下载失败，跳过"

          fi
      - name: Download ncnn
        run: |
          if [ -d "app/src/main/cpp/third_party/ncnn/arm64-v8a/include" ]; then exit 0; fi
          curl -L -o ncnn.zip "https://github.com/Tencent/ncnn/releases/download/20240410/ncnn-20240410-android-vulkan.zip" --connect-timeout 15 --max-time 180
          if unzip -t ncnn.zip >/dev/null 2>&1; then
            unzip -q ncnn.zip
            mkdir -p app/src/main/cpp/third_party/ncnn/arm64-v8a app/src/main/cpp/third_party/ncnn/armeabi-v7a
            cp -r ncnn-20240410-android-vulkan/arm64-v8a/* app/src/main/cpp/third_party/ncnn/arm64-v8a/
            cp -r ncnn-20240410-android-vulkan/armeabi-v7a/* app/src/main/cpp/third_party/ncnn/armeabi-v7a/
          else
            mkdir -p app/src/main/cpp/third_party/ncnn/arm64-v8a/include app/src/main/cpp/third_party/ncnn/armeabi-v7a/include
          fi
      - name: Build FFmpeg
        run: |
          NDK=/usr/local/lib/android/sdk/ndk/26.1.10909125
          TC=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          PREFIX=$GITHUB_WORKSPACE/app/src/main/cpp/third_party/ffmpeg/arm64-v8a
          mkdir -p $PREFIX
          if [ -f "$PREFIX/lib/libavcodec.a" ]; then exit 0; fi
          git clone --depth=1 --branch=n6.1 https://github.com/FFmpeg/FFmpeg.git ffmpeg_src
          cd ffmpeg_src
          ./configure --prefix=$PREFIX --target-os=android --arch=aarch64 --cc=$TC/bin/aarch64-linux-android26-clang --cxx=$TC/bin/aarch64-linux-android26-clang++ --enable-cross-compile --cross-prefix=$TC/bin/llvm- --sysroot=$TC/sysroot --enable-static --disable-shared --disable-doc --disable-programs --disable-asm --disable-autodetect --enable-avcodec --enable-avformat --enable-avutil --enable-swscale --enable-decoder=h264,hevc,aac,mp3,pcm_s16le,mpeg4,vp8,vp9,opus,vorbis --enable-parser=h264,hevc,aac,opus,vp8,vp9 --enable-demuxer=mov,matroska,mp3,aac,wav,ogg,webm,avi --enable-protocol=file --extra-cflags="-Os -fPIC" --extra-ldflags="-lm"
          make -j$(nproc)
          make install
          cd ..
          rm -rf ffmpeg_src

          rm -f ncnn.zip
      - name: Download MNN
        run: |
          if [ -d "app/src/main/cpp/third_party/mnn/arm64-v8a/lib" ]; then exit 0; fi
          D=0
          for V in 2.9.0 2.8.0 2.7.0; do
            U="https://github.com/alibaba/MNN/releases/download/$V/MNN-$V-android.zip"
            if curl -L -f -o MNN.zip "$U" --connect-timeout 15 --max-time 180 2>/dev/null; then
              if unzip -t MNN.zip >/dev/null 2>&1; then
                unzip -q MNN.zip
                mkdir -p app/src/main/cpp/third_party/mnn/arm64-v8a/lib app/src/main/cpp/third_party/mnn/armeabi-v7a/lib app/src/main/cpp/third_party/mnn/include
                MD="MNN-$V-android"
                if [ -f "$MD/arm64-v8a/libMNN.so" ]; then
                  cp "$MD/arm64-v8a/libMNN.so" app/src/main/cpp/third_party/mnn/arm64-v8a/lib/
                  cp "$MD/armeabi-v7a/libMNN.so" app/src/main/cpp/third_party/mnn/armeabi-v7a/lib/
                fi
                if [ -d "$MD/include" ]; then cp -r "$MD/include/"* app/src/main/cpp/third_party/mnn/include/; fi
                D=1; break
              fi
            fi
            rm -f MNN.zip
          done
          if [ "$D" -eq 0 ]; then
            mkdir -p app/src/main/cpp/third_party/mnn/arm64-v8a/lib app/src/main/cpp/third_party/mnn/armeabi-v7a/lib app/src/main/cpp/third_party/mnn/include
          fi
      - name: Build RNNoise
        run: |
          if [ -f "app/src/main/cpp/third_party/rnnoise/arm64-v8a/lib/librnnoise.a" ]; then exit 0; fi
          git clone --depth=1 https://github.com/xiph/rnnoise.git || true
          if [ -d "rnnoise" ]; then
            cd rnnoise
            ./autogen.sh 2>/dev/null || true
            NDK=$ANDROID_NDK_HOME
            TC=$NDK/toolchains/llvm/prebuilt/linux-x86_64
            for A in "arm64-v8a aarch64-linux-android" "armeabi-v7a armv7a-linux-androideabi"; do
              ABI=$(echo $A | awk '{print $1}')
              CC=$(echo $A | awk '{print $2}')
              export CC="$TC/bin/${CC}26-clang"
              export CXX="$TC/bin/${CC}26-clang++"
              export AR="$TC/bin/llvm-ar"
              export RANLIB="$TC/bin/llvm-ranlib"
              mkdir -p b_$ABI && cd b_$ABI
              ../configure --host=$CC --disable-shared --enable-static CFLAGS="-O2" 2>/dev/null || true
              make -j$(nproc) 2>/dev/null || true
              cd ..
              mkdir -p $GITHUB_WORKSPACE/app/src/main/cpp/third_party/rnnoise/$ABI/lib $GITHUB_WORKSPACE/app/src/main/cpp/third_party/rnnoise/include
              if [ -f b_$ABI/.libs/librnnoise.a ]; then
                cp b_$ABI/.libs/librnnoise.a $GITHUB_WORKSPACE/app/src/main/cpp/third_party/rnnoise/$ABI/lib/
              else
                touch $GITHUB_WORKSPACE/app/src/main/cpp/third_party/rnnoise/$ABI/lib/librnnoise.a
              fi
              cp ../include/rnnoise.h $GITHUB_WORKSPACE/app/src/main/cpp/third_party/rnnoise/include/ 2>/dev/null || true
            done
            cd ..
          else
            mkdir -p app/src/main/cpp/third_party/rnnoise/arm64-v8a/lib app/src/main/cpp/third_party/rnnoise/armeabi-v7a/lib app/src/main/cpp/third_party/rnnoise/include
          fi
      - name: Setup Python
        run: |
          sudo apt-get install -y python3 python3-pip 2>/dev/null || true
          pip3 install --user onnx torch torchvision --quiet 2>/dev/null || true
      - name: Download Whisper-tiny ONNX
        run: |
          mkdir -p app/src/main/assets/ai_models
          if [ -f "app/src/main/assets/ai_models/whisper_tiny_fp32.bin" ] && [ -s "app/src/main/assets/ai_models/whisper_tiny_fp32.bin" ]; then exit 0; fi
          curl -L -o whisper.onnx "https://huggingface.co/openai/whisper-tiny/resolve/main/model.onnx" --connect-timeout 30 --max-time 300
          if [ -f "whisper.onnx" ] && [ -s "whisper.onnx" ]; then
            mv whisper.onnx app/src/main/assets/ai_models/whisper_tiny_fp32.bin
          else
            touch app/src/main/assets/ai_models/whisper_tiny_fp32.bin
          fi
      - name: Download SAM2-base ONNX
        run: |
          mkdir -p app/src/main/assets/ai_models
          if [ -f "app/src/main/assets/ai_models/sam2_base_fp32.bin" ] && [ -s "app/src/main/assets/ai_models/sam2_base_fp32.bin" ]; then exit 0; fi
          curl -L -o sam2.onnx "https://dl.fbaipublicfiles.com/segment_anything_2/092824/sam2_base.onnx" --connect-timeout 30 --max-time 600
          if [ -f "sam2.onnx" ] && [ -s "sam2.onnx" ]; then
            mv sam2.onnx app/src/main/assets/ai_models/sam2_base_fp32.bin
          else
            touch app/src/main/assets/ai_models/sam2_base_fp32.bin
          fi
      - name: Prepare RNNoise model
        run: |
          mkdir -p app/src/main/assets/ai_models
          if [ -f "app/src/main/assets/ai_models/rnnoise_fp32.bin" ] && [ -s "app/src/main/assets/ai_models/rnnoise_fp32.bin" ]; then exit 0; fi
          if [ -f "rnnoise/model/rnnoise_data.bin" ]; then
            cp rnnoise/model/rnnoise_data.bin app/src/main/assets/ai_models/rnnoise_fp32.bin
          else
            touch app/src/main/assets/ai_models/rnnoise_fp32.bin
          fi
      - name: Convert RealESRGAN to ONNX
        run: |
          mkdir -p app/src/main/assets/ai_models
          if [ -f "app/src/main/assets/ai_models/esrgan_x4_fp32.bin" ] && [ -s "app/src/main/assets/ai_models/esrgan_x4_fp32.bin" ]; then exit 0; fi
          git clone --depth=1 https://github.com/xinntao/Real-ESRGAN.git 2>/dev/null || true
          cd Real-ESRGAN
          if [ -f "weights/RealESRGAN_x4plus.pth" ]; then
            python3 $GITHUB_WORKSPACE/scripts/convert_esrgan.py 2>/dev/null || echo "ESRGAN转换失败"
            cd ..
            if [ -f "esrgan_x4.onnx" ] && [ -s "esrgan_x4.onnx" ]; then
              mv esrgan_x4.onnx app/src/main/assets/ai_models/esrgan_x4_fp32.bin
            else
              touch app/src/main/assets/ai_models/esrgan_x4_fp32.bin
            fi
          else
            cd ..
            touch app/src/main/assets/ai_models/esrgan_x4_fp32.bin
          fi
      - name: Convert RIFE to ONNX
        run: |
          mkdir -p app/src/main/assets/ai_models
          if [ -f "app/src/main/assets/ai_models/rife_v4_fp32.bin" ] && [ -s "app/src/main/assets/ai_models/rife_v4_fp32.bin" ]; then exit 0; fi
          git clone --depth=1 https://github.com/megvii-research/ECCV2022-RIFE.git 2>/dev/null || true
          cd ECCV2022-RIFE
          if [ -f "train_log/RIFE_net.pth" ]; then
            python3 $GITHUB_WORKSPACE/scripts/convert_rife.py 2>/dev/null || echo "RIFE转换失败"
            cd ..
            if [ -f "rife_v4.onnx" ] && [ -s "rife_v4.onnx" ]; then
              mv rife_v4.onnx app/src/main/assets/ai_models/rife_v4_fp32.bin
            else
              touch app/src/main/assets/ai_models/rife_v4_fp32.bin
            fi
          else
            cd ..
            touch app/src/main/assets/ai_models/rife_v4_fp32.bin
          fi
      - name: Convert Demucs to ONNX
        run: |
          mkdir -p app/src/main/assets/ai_models
          if [ -f "app/src/main/assets/ai_models/demucs_ft_fp16.bin" ] && [ -s "app/src/main/assets/ai_models/demucs_ft_fp16.bin" ]; then exit 0; fi
          git clone --depth=1 https://github.com/facebookresearch/demucs.git 2>/dev/null || true
          cd demucs
          if [ -f "pretrained_models/htdemucs_ft.th" ]; then
            python3 $GITHUB_WORKSPACE/scripts/convert_demucs.py 2>/dev/null || echo "Demucs转换失败"
            cd ..
            if [ -f "demucs_ft.onnx" ] && [ -s "demucs_ft.onnx" ]; then
              mv demucs_ft.onnx app/src/main/assets/ai_models/demucs_ft_fp16.bin
            else
              touch app/src/main/assets/ai_models/demucs_ft_fp16.bin
            fi
          else
            cd ..
            touch app/src/main/assets/ai_models/demucs_ft_fp16.bin
          fi
      - name: Create keystore
        run: |
          mkdir -p keystore
          if [ -f "keystore/nexclip.jks" ]; then exit 0; fi
          keytool -genkeypair -v -keystore keystore/nexclip.jks -alias nexclip -keyalg RSA -keysize 2048 -validity 10000 -storepass nexclip123 -keypass nexclip123 -dname "CN=NexClip,OU=Dev,O=NexClip,L=Shanghai,ST=Shanghai,C=CN"
          keytool -genkeypair -v -keystore keystore/debug.jks -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,OU=Android,O=Android,L=Mountain View,ST=California,C=US"
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build Debug APK
        run: |
          export KEYSTORE_PASSWORD=nexclip123
          export KEY_PASSWORD=nexclip123
          ./gradlew assemble${{ matrix.flavor }}Debug --stacktrace --no-daemon
      - name: Build Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          export KEYSTORE_PASSWORD=nexclip123
          export KEY_PASSWORD=nexclip123
          ./gradlew assemble${{ matrix.flavor }}Release --stacktrace --no-daemon
      - name: Check APK exists
        run: |
          find app/build/outputs/apk -name "*.apk" -type f 2>/dev/null | while read apk; do
            SIZE=$(du -h "$apk" | cut -f1)
            echo "APK: $apk ($SIZE)"
          done
          APK_COUNT=$(find app/build/outputs/apk -name "*.apk" -type f 2>/dev/null | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then echo "WARNING: 未找到APK"; fi
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexclip-${{ matrix.flavor }}-debug
          path: app/build/outputs/apk/${{ matrix.flavor }}/debug/*.apk
          if-no-files-found: warn
          retention-days: 30
      - name: Upload Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: nexclip-${{ matrix.flavor }}-release
          path: app/build/outputs/apk/${{ matrix.flavor }}/release/*.apk
          if-no-files-found: warn
          retention-days: 90
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/${{ matrix.flavor }}/release/*.apk
            app/build/outputs/apk/${{ matrix.flavor }}/debug/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
