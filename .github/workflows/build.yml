name: NexClip Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  ANDROID_NDK_VERSION: "26.1.10909125"
  JAVA_VERSION: "17"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        flavor: [free]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk 2>/dev/null || true
          sudo rm -rf /usr/share/dotnet 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          df -h

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager "ndk;${{ env.ANDROID_NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> local.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache third-party libs
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/third_party
          key: third-party-v3-${{ runner.os }}
          restore-keys: third-party-v3-${{ runner.os }}-

      - name: Link security Kotlin files
        run: |
          mkdir -p app/src/main/java/com/myvideo/editor/security
          if [ -d "core/security/src/main/java" ]; then
            find core/security/src/main/java -name "*.kt" -type f | while read f; do
              filename=$(basename "$f")
              target="app/src/main/java/com/myvideo/editor/security/$filename"
              if [ ! -f "$target" ]; then cp "$f" "$target"; fi
            done
          fi

      - name: Build OpenSSL for Android
        run: |
          echo "=== 编译 OpenSSL ==="
          if [ -d "app/src/main/cpp/openssl/arm64-v8a" ]; then
            echo "OpenSSL已存在，跳过"
            exit 0
          fi
          wget -q https://github.com/openssl/openssl/releases/download/openssl-3.2.1/openssl-3.2.1.tar.gz
          tar -xzf openssl-3.2.1.tar.gz
          cd openssl-3.2.1
          NDK=$ANDROID_NDK_HOME
          TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          API=26
          export ANDROID_NDK_ROOT=$NDK
          export PATH=$TOOLCHAIN/bin:$PATH
          for ARCH_CFG_CC in "arm64-v8a android-arm64 aarch64-linux-android" "armeabi-v7a android-arm armv7a-linux-androideabi"; do
            ARCH=$(echo $ARCH_CFG_CC | cut -d' ' -f1)
            CFG=$(echo $ARCH_CFG_CC | cut -d' ' -f2)
            CC_PREFIX=$(echo $ARCH_CFG_CC | cut -d' ' -f3)
            echo "编译 OpenSSL ${ARCH}..."
            export CC="${CC_PREFIX}${API}-clang"
            export CXX="${CC_PREFIX}${API}-clang++"
            export AR="llvm-ar"
            export RANLIB="llvm-ranlib"
            export STRIP="llvm-strip"
            mkdir -p build_${ARCH} && cd build_${ARCH}
            ../Configure ${CFG} --prefix=$GITHUB_WORKSPACE/openssl/${ARCH} no-shared no-tests no-asm no-engine -D__ANDROID_API__=${API}
            make -j$(nproc) build_libs
            make install_sw
            cd ..
          done
          mkdir -p $GITHUB_WORKSPACE/app/src/main/cpp/openssl/include
          mkdir -p $GITHUB_WORKSPACE/app/src/main/cpp/openssl/arm64-v8a
          mkdir -p $GITHUB_WORKSPACE/app/src/main/cpp/openssl/armeabi-v7a
          cp -r $GITHUB_WORKSPACE/openssl/arm64-v8a/include/* $GITHUB_WORKSPACE/app/src/main/cpp/openssl/include/
          cp $GITHUB_WORKSPACE/openssl/arm64-v8a/lib/libcrypto.a $GITHUB_WORKSPACE/app/src/main/cpp/openssl/arm64-v8a/
          cp $GITHUB_WORKSPACE/openssl/armeabi-v7a/lib/libcrypto.a $GITHUB_WORKSPACE/app/src/main/cpp/openssl/armeabi-v7a/
          echo "OpenSSL 编译完成"

      - name: Download opencv-mobile
        run: |
          echo "=== 下载 opencv-mobile ==="
          mkdir -p app/src/main/cpp/third_party/opencv-mobile
          if [ -d "app/src/main/cpp/third_party/opencv-mobile/sdk" ]; then
            echo "opencv-mobile已存在，跳过"
            exit 0
          fi
          DOWNLOADED=0
          for TAG in v2.5 v2.4 v2.3 v2.2 v2.1; do
            for VER in 4.10.0 4.9.0 4.8.0 4.7.0 4.6.0; do
              URL="https://github.com/nihui/opencv-mobile/releases/download/${TAG}/opencv-mobile-${VER}-android-sdk.zip"
              echo "尝试: $URL"
              if curl -L -f -o opencv.zip "$URL" --connect-timeout 15 --max-time 120 2>/dev/null; then
                if unzip -t opencv.zip >/dev/null 2>&1; then
                  unzip -q opencv.zip -d app/src/main/cpp/third_party/opencv-mobile/
                  DOWNLOADED=1
                  echo "opencv-mobile ${VER} 下载成功"
                  break 2
                fi
              fi
              rm -f opencv.zip
            done
          done
          if [ "$DOWNLOADED" -eq 0 ]; then
            echo "opencv-mobile全部地址失败，创建空目录"
            mkdir -p app/src/main/cpp/third_party/opencv-mobile/sdk/native/jni/include
            mkdir -p app/src/main/cpp/third_party/opencv-mobile/sdk/native/libs/arm64-v8a
            mkdir -p app/src/main/cpp/third_party/opencv-mobile/sdk/native/libs/armeabi-v7a
          fi

      - name: Download ncnn
        run: |
          echo "=== 下载 ncnn ==="
          if [ -d "app/src/main/cpp/third_party/ncnn/arm64-v8a/include" ]; then
            echo "ncnn已存在，跳过"
            exit 0
          fi
          curl -L -o ncnn.zip "https://github.com/Tencent/ncnn/releases/download/20240410/ncnn-20240410-android-vulkan.zip" --connect-timeout 15 --max-time 180
          if unzip -t ncnn.zip >/dev/null 2>&1; then
            unzip -q ncnn.zip
            mkdir -p app/src/main/cpp/third_party/ncnn/arm64-v8a
            mkdir -p app/src/main/cpp/third_party/ncnn/armeabi-v7a
            cp -r ncnn-20240410-android-vulkan/arm64-v8a/* app/src/main/cpp/third_party/ncnn/arm64-v8a/
            cp -r ncnn-20240410-android-vulkan/armeabi-v7a/* app/src/main/cpp/third_party/ncnn/armeabi-v7a/
            echo "ncnn 下载成功"
          else
            echo "ncnn 下载失败，创建空目录"
            mkdir -p app/src/main/cpp/third_party/ncnn/arm64-v8a/include
            mkdir -p app/src/main/cpp/third_party/ncnn/armeabi-v7a/include
          fi
          rm -f ncnn.zip

      - name: Download MNN
        run: |
          echo "=== 下载 MNN ==="
          if [ -d "app/src/main/cpp/third_party/mnn/arm64-v8a/lib" ]; then
            echo "MNN已存在，跳过"
            exit 0
          fi
          DOWNLOADED=0
          for VER in 2.9.0 2.8.0 2.7.0; do
            URL="https://github.com/alibaba/MNN/releases/download/${VER}/MNN-${VER}-android.zip"
            echo "尝试 MNN: $URL"
            if curl -L -f -o MNN.zip "$URL" --connect-timeout 15 --max-time 180 2>/dev/null; then
              if unzip -t MNN.zip >/dev/null 2>&1; then
                unzip -q MNN.zip
                mkdir -p app/src/main/cpp/third_party/mnn/arm64-v8a/lib
                mkdir -p app/src/main/cpp/third_party/mnn/armeabi-v7a/lib
                mkdir -p app/src/main/cpp/third_party/mnn/include
                MNN_DIR="MNN-${VER}-android"
                if [ -f "$MNN_DIR/arm64-v8a/libMNN.so" ]; then
                  cp "$MNN_DIR/arm64-v8a/libMNN.so" app/src/main/cpp/third_party/mnn/arm64-v8a/lib/
                  cp "$MNN_DIR/armeabi-v7a/libMNN.so" app/src/main/cpp/third_party/mnn/armeabi-v7a/lib/
                fi
                if [ -d "$MNN_DIR/include" ]; then
                  cp -r "$MNN_DIR/include/"* app/src/main/cpp/third_party/mnn/include/
                fi
                echo "MNN ${VER} 下载成功"
                DOWNLOADED=1
                break
              fi
            fi
            rm -f MNN.zip
          done
          if [ "$DOWNLOADED" -eq 0 ]; then
            echo "MNN 全部地址失败，创建空目录"
            mkdir -p app/src/main/cpp/third_party/mnn/arm64-v8a/lib
            mkdir -p app/src/main/cpp/third_party/mnn/armeabi-v7a/lib
            mkdir -p app/src/main/cpp/third_party/mnn/include
          fi

      - name: Build RNNoise
        run: |
          echo "=== 编译 RNNoise ==="
          if [ -f "app/src/main/cpp/third_party/rnnoise/arm64-v8a/lib/librnnoise.a" ]; then
            echo "RNNoise已存在，跳过"
            exit 0
          fi
          git clone --depth=1 https://github.com/xiph/rnnoise.git || true
          if [ -d "rnnoise" ]; then
            cd rnnoise
            ./autogen.sh 2>/dev/null || true
            NDK=$ANDROID_NDK_HOME
            TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
            API=26
            for ABI_CC in "arm64-v8a aarch64-linux-android" "armeabi-v7a armv7a-linux-androideabi"; do
              ABI=$(echo $ABI_CC | cut -d' ' -f1)
              CC_PREFIX=$(echo $ABI_CC | cut -d' ' -f2)
              echo "编译 RNNoise ${ABI}..."
              export CC="${TOOLCHAIN}/bin/${CC_PREFIX}${API}-clang"
              export CXX="${TOOLCHAIN}/bin/${CC_PREFIX}${API}-clang++"
              export AR="${TOOLCHAIN}/bin/llvm-ar"
              export RANLIB="${TOOLCHAIN}/bin/llvm-ranlib"
              mkdir -p build_${ABI} && cd build_${ABI}
              ../configure --host=${CC_PREFIX} --disable-shared --enable-static CFLAGS="-O2" 2>/dev/null || true
              make -j$(nproc) 2>/dev/null || true
              cd ..
              mkdir -p $GITHUB_WORKSPACE/app/src/main/cpp/third_party/rnnoise/${ABI}/lib
              mkdir -p $GITHUB_WORKSPACE/app/src/main/cpp/third_party/rnnoise/include
              if [ -f build_${ABI}/.libs/librnnoise.a ]; then
                cp build_${ABI}/.libs/librnnoise.a $GITHUB_WORKSPACE/app/src/main/cpp/third_party/rnnoise/${ABI}/lib/
                echo "RNNoise ${ABI} 编译成功"
              else
                echo "RNNoise ${ABI} 编译失败，创建占位文件"
                touch $GITHUB_WORKSPACE/app/src/main/cpp/third_party/rnnoise/${ABI}/lib/librnnoise.a
              fi
              cp ../include/rnnoise.h $GITHUB_WORKSPACE/app/src/main/cpp/third_party/rnnoise/include/ 2>/dev/null || true
            done
            cd ..
          else
            echo "rnnoise克隆失败，创建空目录"
            mkdir -p app/src/main/cpp/third_party/rnnoise/arm64-v8a/lib
            mkdir -p app/src/main/cpp/third_party/rnnoise/armeabi-v7a/lib
            mkdir -p app/src/main/cpp/third_party/rnnoise/include
          fi

      - name: Setup Python for model conversion
        run: |
          echo "=== 安装Python + 转换工具 ==="
          sudo apt-get install -y python3 python3-pip 2>/dev/null || true
          pip3 install --user onnx torch torchvision --quiet 2>/dev/null || true
          echo "Python环境准备完成"

      - name: Download Whisper-tiny ONNX
        run: |
          echo "=== 下载 Whisper-tiny ONNX ==="
          mkdir -p app/src/main/assets/ai_models
          if [ -f "app/src/main/assets/ai_models/whisper_tiny_fp32.bin" ] && [ -s "app/src/main/assets/ai_models/whisper_tiny_fp32.bin" ]; then
            echo "Whisper模型已存在，跳过"
            exit 0
          fi
          curl -L -o whisper.onnx "https://huggingface.co/openai/whisper-tiny/resolve/main/model.onnx" --connect-timeout 30 --max-time 300
          if [ -f "whisper.onnx" ] && [ -s "whisper.onnx" ]; then
            mv whisper.onnx app/src/main/assets/ai_models/whisper_tiny_fp32.bin
            echo "Whisper-tiny 下载成功"
          else
            echo "Whisper-tiny 下载失败，创建空文件"
            touch app/src/main/assets/ai_models/whisper_tiny_fp32.bin
          fi

      - name: Download SAM2-base ONNX
        run: |
          echo "=== 下载 SAM2-base ONNX ==="
          mkdir -p app/src/main/assets/ai_models
          if [ -f "app/src/main/assets/ai_models/sam2_base_fp32.bin" ] && [ -s "app/src/main/assets/ai_models/sam2_base_fp32.bin" ]; then
            echo "SAM2模型已存在，跳过"
            exit 0
          fi
          curl -L -o sam2.onnx "https://dl.fbaipublicfiles.com/segment_anything_2/092824/sam2_base.onnx" --connect-timeout 30 --max-time 600
          if [ -f "sam2.onnx" ] && [ -s "sam2.onnx" ]; then
            mv sam2.onnx app/src/main/assets/ai_models/sam2_base_fp32.bin
            echo "SAM2-base 下载成功"
          else
            echo "SAM2-base 下载失败，创建空文件"
            touch app/src/main/assets/ai_models/sam2_base_fp32.bin
          fi

      - name: Prepare RNNoise model
        run: |
          echo "=== 准备 RNNoise 模型 ==="
          mkdir -p app/src/main/assets/ai_models
          if [ -f "app/src/main/assets/ai_models/rnnoise_fp32.bin" ] && [ -s "app/src/main/assets/ai_models/rnnoise_fp32.bin" ]; then
            echo "RNNoise模型已存在，跳过"
            exit 0
          fi
          if [ -f "rnnoise/model/rnnoise_data.bin" ]; then
            cp rnnoise/model/rnnoise_data.bin app/src/main/assets/ai_models/rnnoise_fp32.bin
            echo "RNNoise模型复制成功"
          else
            echo "RNNoise模型文件不存在，创建空文件"
            touch app/src/main/assets/ai_models/rnnoise_fp32.bin
          fi

      - name: Convert RealESRGAN to ONNX
        run: |
          echo "=== 转换 RealESRGAN ==="
          mkdir -p app/src/main/assets/ai_models
          if [ -f "app/src/main/assets/ai_models/esrgan_x4_fp32.bin" ] && [ -s "app/src/main/assets/ai_models/esrgan_x4_fp32.bin" ]; then
            echo "RealESRGAN模型已存在，跳过"
            exit 0
          fi
          git clone --depth=1 https://github.com/xinntao/Real-ESRGAN.git 2>/dev/null || true
          cd Real-ESRGAN
          if [ -f "weights/RealESRGAN_x4plus.pth" ]; then
            cat > /tmp/convert_esrgan.py << 'PYEOF'
import torch
import sys
sys.path.append('.')
from realesrgan.archs.srvgg_arch import SRVGGNetCompact
model = SRVGGNetCompact(num_in_ch=3, num_out_ch=3, num_feat=64, num_block=23, num_grow_ch=32, scale=4)
model.load_state_dict(torch.load('weights/RealESRGAN_x4plus.pth')['params'], strict=True)
model.eval()
dummy = torch.randn(1, 3, 64, 64)
torch.onnx.export(model, dummy, '../esrgan_x4.onnx', opset_version=11)
print('RealESRGAN转换成功')
PYEOF
            python3 /tmp/convert_esrgan.py 2>/dev/null || echo "RealESRGAN转换脚本执行失败"
            cd ..
            if [ -f "esrgan_x4.onnx" ] && [ -s "esrgan_x4.onnx" ]; then
              mv esrgan_x4.onnx app/src/main/assets/ai_models/esrgan_x4_fp32.bin
              echo "RealESRGAN转换完成"
            else
              echo "RealESRGAN转换失败，创建空文件"
              touch app/src/main/assets/ai_models/esrgan_x4_fp32.bin
            fi
          else
            cd ..
            echo "RealESRGAN权重文件不存在，创建空文件"
            touch app/src/main/assets/ai_models/esrgan_x4_fp32.bin
          fi

      - name: Convert RIFE to ONNX
        run: |
          echo "=== 转换 RIFE ==="
          mkdir -p app/src/main/assets/ai_models
          if [ -f "app/src/main/assets/ai_models/rife_v4_fp32.bin" ] && [ -s "app/src/main/assets/ai_models/rife_v4_fp32.bin" ]; then
            echo "RIFE模型已存在，跳过"
            exit 0
          fi
          git clone --depth=1 https://github.com/megvii-research/ECCV2022-RIFE.git 2>/dev/null || true
          cd ECCV2022-RIFE
          if [ -f "train_log/RIFE_net.pth" ]; then
            cat > /tmp/convert_rife.py << 'PYEOF'
import torch
import sys
sys.path.append('.')
from model.RIFE import Model
model = Model()
model.load_model('train_log/RIFE_net.pth')
model.eval()
dummy1 = torch.randn(1, 3, 256, 256)
dummy2 = torch.randn(1, 3, 256, 256)
torch.onnx.export(model, (dummy1, dummy2), '../rife_v4.onnx', opset_version=11)
print('RIFE转换成功')
PYEOF
            python3 /tmp/convert_rife.py 2>/dev/null || echo "RIFE转换脚本执行失败"
            cd ..
            if [ -f "rife_v4.onnx" ] && [ -s "rife_v4.onnx" ]; then
              mv rife_v4.onnx app/src/main/assets/ai_models/rife_v4_fp32.bin
              echo "RIFE转换完成"
            else
              echo "RIFE转换失败，创建空文件"
              touch app/src/main/assets/ai_models/rife_v4_fp32.bin
            fi
          else
            cd ..
            echo "RIFE权重文件不存在，创建空文件"
            touch app/src/main/assets/ai_models/rife_v4_fp32.bin
          fi

      - name: Convert Demucs to ONNX
        run: |
          echo "=== 转换 Demucs ==="
          mkdir -p app/src/main/assets/ai_models
          if [ -f "app/src/main/assets/ai_models/demucs_ft_fp16.bin" ] && [ -s "app/src/main/assets/ai_models/demucs_ft_fp16.bin" ]; then
            echo "Demucs模型已存在，跳过"
            exit 0
          fi
          git clone --depth=1 https://github.com/facebookresearch/demucs.git 2>/dev/null || true
          cd demucs
          if [ -f "pretrained_models/htdemucs_ft.th" ]; then
            cat > /tmp/convert_demucs.py << 'PYEOF'
import torch
import sys
sys.path.append('.')
from demucs.pretrained import get_model
model = get_model('htdemucs_ft')
model.eval()
dummy = torch.randn(1, 4, 44100*10)
torch.onnx.export(model, dummy, '../demucs_ft.onnx', opset_version=11)
print('Demucs转换成功')
PYEOF
            python3 /tmp/convert_demucs.py 2>/dev/null || echo "Demucs转换脚本执行失败"
            cd ..
            if [ -f "demucs_ft.onnx" ] && [ -s "demucs_ft.onnx" ]; then
              mv demucs_ft.onnx app/src/main/assets/ai_models/demucs_ft_fp16.bin
              echo "Demucs转换完成"
            else
              echo "Demucs转换失败，创建空文件"
              touch app/src/main/assets/ai_models/demucs_ft_fp16.bin
            fi
          else
            cd ..
            echo "Demucs权重文件不存在，创建空文件"
            touch app/src/main/assets/ai_models/demucs_ft_fp16.bin
          fi

      - name: Create keystore
        run: |
          echo "=== 创建签名密钥 ==="
          mkdir -p keystore
          keytool -genkeypair -v -keystore keystore/nexclip.jks -alias nexclip -keyalg RSA -keysize 2048 -validity 10000 -storepass nexclip123 -keypass nexclip123 -dname "CN=NexClip,OU=Dev,O=NexClip,L=Shanghai,ST=Shanghai,C=CN"
          keytool -genkeypair -v -keystore keystore/debug.jks -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,OU=Android,O=Android,L=Mountain View,ST=California,C=US"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          echo "=== 开始编译 ${{ matrix.flavor }} Debug APK ==="
          export KEYSTORE_PASSWORD=nexclip123
          export KEY_PASSWORD=nexclip123
          ./gradlew assemble${{ matrix.flavor }}Debug --stacktrace --no-daemon 2>&1 | tail -300
          echo "=== 编译完成 ==="

      - name: Build Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "=== 开始编译 ${{ matrix.flavor }} Release APK ==="
          export KEYSTORE_PASSWORD=nexclip123
          export KEY_PASSWORD=nexclip123
          ./gradlew assemble${{ matrix.flavor }}Release --stacktrace --no-daemon 2>&1 | tail -300
          echo "=== Release 编译完成 ==="

      - name: Check APK exists
        run: |
          echo "=== 检查编译产物 ==="
          find app/build/outputs/apk -name "*.apk" -type f 2>/dev/null | while read apk; do
            SIZE=$(du -h "$apk" | cut -f1)
            echo "APK: $apk ($SIZE)"
          done
          APK_COUNT=$(find app/build/outputs/apk -name "*.apk" -type f 2>/dev/null | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "WARNING: 未找到APK文件"
          else
            echo "共找到 $APK_COUNT 个APK"
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexclip-${{ matrix.flavor }}-debug
          path: app/build/outputs/apk/${{ matrix.flavor }}/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: nexclip-${{ matrix.flavor }}-release
          path: app/build/outputs/apk/${{ matrix.flavor }}/release/*.apk
          if-no-files-found: warn
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/${{ matrix.flavor }}/release/*.apk
            app/build/outputs/apk/${{ matrix.flavor }}/debug/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
