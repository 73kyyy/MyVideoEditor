<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NexClip Editor V2</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#121216;--panel:#1C1C1E;--timeline-bg:#181820;--track-bg:#181820;
  --text-primary:#C8C8D0;--text-secondary:#6A6A74;--accent:#6366F1;
  --clip-blue:#60A5FA;--clip-purple:#8B5CF6;--clip-orange:#F59E0B;
  --clip-pink:#EC4899;--clip-green:#10B981;--handle:#3A3A3C;
  --border:#2A2A2E;--radius:8px;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text-primary);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:13px;-webkit-user-select:none;user-select:none;touch-action:none}

/* ===== Layout ===== */
.editor{display:flex;flex-direction:column;width:100%;height:100%;overflow:hidden}

/* Title Bar */
.title-bar{display:flex;align-items:center;justify-content:space-between;height:44px;min-height:44px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--border);z-index:10}
.title-bar .left,.title-bar .right{display:flex;align-items:center;gap:8px}
.title-bar .center{flex:1;text-align:center;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.tb-btn{background:none;border:none;color:var(--text-primary);cursor:pointer;padding:6px 8px;border-radius:6px;font-size:13px;display:flex;align-items:center;gap:4px;transition:background .15s}
.tb-btn:hover{background:rgba(255,255,255,.08)}
.tb-btn svg{width:18px;height:18px;fill:currentColor}
.tb-btn.primary{background:var(--accent);color:#fff;padding:6px 14px;border-radius:6px;font-weight:600}
.tb-btn.primary:hover{background:#5558e6}

/* Main Area */
.main-area{display:flex;flex:1;min-height:0;overflow:hidden;position:relative}

/* Preview */
.preview-panel{position:relative;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden;min-width:20%;max-width:80%}
.preview-panel video,.preview-panel .preview-placeholder{width:100%;height:100%;object-fit:contain}
.preview-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-secondary);gap:8px}
.preview-placeholder svg{width:48px;height:48px;fill:var(--text-secondary);opacity:.5}
.preview-time{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.7);padding:2px 8px;border-radius:4px;font-size:11px;font-variant-numeric:tabular-nums}

/* Resize Handle */
.resize-handle{width:6px;cursor:col-resize;background:var(--handle);display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;z-index:5;transition:background .15s}
.resize-handle:hover,.resize-handle.active{background:var(--accent)}
.resize-handle::after{content:'';width:2px;height:24px;border-radius:2px;background:rgba(255,255,255,.3)}
.resize-handle .dots{display:flex;flex-direction:column;gap:3px;position:absolute}
.resize-handle .dots span{width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.4)}

/* Tool Panel */
.tool-panel{flex:1;min-width:20%;max-width:80%;background:var(--panel);display:flex;flex-direction:column;overflow:hidden}
.tool-panel-header{padding:10px 14px;font-weight:600;font-size:13px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.tool-panel-content{flex:1;overflow-y:auto;padding:12px 14px;scrollbar-width:thin;scrollbar-color:var(--handle) transparent}
.tool-panel-content::-webkit-scrollbar{width:4px}
.tool-panel-content::-webkit-scrollbar-thumb{background:var(--handle);border-radius:2px}

/* Timeline Area */
.timeline-area{height:200px;min-height:100px;background:var(--timeline-bg);border-top:1px solid var(--border);display:flex;flex-direction:column;position:relative;overflow:hidden}
.timeline-header{display:flex;align-items:center;justify-content:space-between;padding:4px 10px;background:rgba(0,0,0,.2);font-size:11px;color:var(--text-secondary);min-height:28px}
.timeline-header .zoom-info{font-variant-numeric:tabular-nums}
.timeline-body{flex:1;display:flex;overflow:hidden;position:relative}
.track-labels{width:72px;min-width:72px;background:var(--track-bg);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0}
.track-label{height:36px;display:flex;align-items:center;padding:0 8px;gap:4px;font-size:11px;border-bottom:1px solid rgba(255,255,255,.04);cursor:default}
.track-label .track-icon{width:14px;height:14px;flex-shrink:0}
.track-label .track-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track-label .track-actions{display:flex;gap:2px}
.track-label .track-actions button{background:none;border:none;color:var(--text-secondary);cursor:pointer;padding:2px;border-radius:3px;font-size:10px;line-height:1}
.track-label .track-actions button:hover{color:var(--text-primary);background:rgba(255,255,255,.08)}
.track-label .track-actions button.active{color:var(--accent)}
.track-label .track-actions button.muted{color:#EF4444}

.timeline-tracks{flex:1;overflow:hidden;position:relative}
.timeline-scroll{position:absolute;top:0;left:0;bottom:0;transform-origin:0 0}
.time-ruler{height:22px;position:relative;border-bottom:1px solid var(--border);background:rgba(0,0,0,.15)}
.time-ruler canvas{width:100%;height:100%}
.tracks-container{position:relative}
.track-row{height:36px;position:relative;border-bottom:1px solid rgba(255,255,255,.04)}
.clip{position:absolute;top:3px;bottom:3px;border-radius:4px;cursor:pointer;display:flex;align-items:center;padding:0 8px;font-size:10px;font-weight:500;color:#fff;overflow:hidden;white-space:nowrap;transition:box-shadow .15s,transform .1s;border:1.5px solid transparent}
.clip:hover{box-shadow:0 0 0 1px rgba(255,255,255,.3)}
.clip.selected{border-color:#fff;box-shadow:0 0 8px rgba(99,102,241,.5)}
.clip .clip-name{overflow:hidden;text-overflow:ellipsis}
.clip-blue{background:var(--clip-blue);opacity:.85}
.clip-purple{background:var(--clip-purple);opacity:.85}
.clip-orange{background:var(--clip-orange);opacity:.85}
.clip-pink{background:var(--clip-pink);opacity:.85}
.clip-green{background:var(--clip-green);opacity:.85}

/* Playhead */
.playhead{position:absolute;top:0;bottom:0;width:2px;background:#fff;z-index:20;pointer-events:none;transform:translateX(-1px)}
.playhead::before{content:'';position:absolute;top:0;left:-5px;width:12px;height:8px;background:#fff;clip-path:polygon(0 0,100% 0,50% 100%);pointer-events:auto;cursor:ew-resize}

/* Playback Controls */
.controls-bar{display:flex;align-items:center;justify-content:center;gap:4px;height:44px;min-height:44px;background:var(--panel);border-top:1px solid var(--border);padding:0 12px}
.ctrl-btn{background:none;border:none;color:var(--text-primary);cursor:pointer;padding:6px 10px;border-radius:6px;font-size:13px;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.ctrl-btn:hover{background:rgba(255,255,255,.08)}
.ctrl-btn:active{transform:scale(.92)}
.ctrl-btn svg{width:20px;height:20px;fill:currentColor}
.ctrl-btn.play-btn{width:40px;height:40px;background:var(--accent);border-radius:50%;color:#fff}
.ctrl-btn.play-btn:hover{background:#5558e6}
.ctrl-btn.play-btn svg{width:22px;height:22px}
.ctrl-btn.disabled{color:var(--text-secondary);pointer-events:none}

/* Toolbar */
.toolbar{display:flex;align-items:center;justify-content:center;gap:2px;height:44px;min-height:44px;background:var(--panel);border-top:1px solid var(--border);padding:0 8px;overflow-x:auto;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.tool-btn{background:none;border:none;color:var(--text-secondary);cursor:pointer;padding:6px 10px;border-radius:6px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap;transition:color .15s,background .15s;flex-shrink:0}
.tool-btn svg{width:18px;height:18px;fill:currentColor}
.tool-btn:hover{color:var(--text-primary);background:rgba(255,255,255,.06)}
.tool-btn.active{color:var(--accent);background:rgba(99,102,241,.12)}

/* Bottom Nav */
.bottom-nav{display:flex;align-items:center;justify-content:space-around;height:48px;min-height:48px;background:var(--panel);border-top:1px solid var(--border)}
.nav-btn{background:none;border:none;color:var(--text-secondary);cursor:pointer;padding:6px 16px;border-radius:6px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:color .15s}
.nav-btn svg{width:20px;height:20px;fill:currentColor}
.nav-btn:hover{color:var(--text-primary)}
.nav-btn.active{color:var(--accent)}

/* ===== Tool Panel Contents ===== */
.tool-section{margin-bottom:16px}
.tool-section-title{font-size:11px;color:var(--text-secondary);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.filter-grid,.effect-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.filter-item,.effect-item{aspect-ratio:16/9;border-radius:6px;overflow:hidden;cursor:pointer;position:relative;border:2px solid transparent;transition:border-color .15s}
.filter-item:hover,.effect-item:hover{border-color:rgba(255,255,255,.2)}
.filter-item.active,.effect-item.active{border-color:var(--accent)}
.filter-item .thumb,.effect-item .thumb{width:100%;height:100%;background:linear-gradient(135deg,#2a2a3e,#1a1a2e);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text-secondary)}
.filter-item .label,.effect-item .label{position:absolute;bottom:0;left:0;right:0;padding:2px 4px;background:rgba(0,0,0,.6);font-size:9px;text-align:center}

.slider-group{margin-bottom:12px}
.slider-label{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px}
.slider-label .val{color:var(--accent);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:2px;background:var(--handle);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid #fff}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid #fff}

.ratio-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ratio-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:border-color .15s,background .15s}
.ratio-item:hover{background:rgba(255,255,255,.05)}
.ratio-item.active{border-color:var(--accent);background:rgba(99,102,241,.1)}
.ratio-item .ratio-box{border:1.5px solid var(--text-secondary);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--text-secondary)}
.ratio-item.active .ratio-box{border-color:var(--accent);color:var(--accent)}
.ratio-item span{font-size:10px;color:var(--text-secondary)}
.ratio-item.active span{color:var(--accent)}

.speed-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.speed-item{padding:8px 4px;text-align:center;border-radius:6px;cursor:pointer;background:rgba(255,255,255,.05);font-size:12px;font-weight:600;border:1.5px solid transparent;transition:all .15s}
.speed-item:hover{background:rgba(255,255,255,.08)}
.speed-item.active{border-color:var(--accent);background:rgba(99,102,241,.12);color:var(--accent)}

.text-styles{display:flex;flex-direction:column;gap:8px}
.text-style-item{padding:10px 12px;border-radius:6px;cursor:pointer;border:1.5px solid var(--border);transition:border-color .15s}
.text-style-item:hover{border-color:rgba(255,255,255,.2)}
.text-style-item.active{border-color:var(--accent)}
.text-style-item .preview{font-size:16px;margin-bottom:2px}
.text-style-item .name{font-size:10px;color:var(--text-secondary)}

.more-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.more-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;border-radius:8px;cursor:pointer;background:rgba(255,255,255,.04);transition:background .15s}
.more-item:hover{background:rgba(255,255,255,.08)}
.more-item svg{width:24px;height:24px;fill:var(--text-secondary)}
.more-item span{font-size:10px;color:var(--text-secondary)}

.pip-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pip-item{padding:12px;border-radius:8px;cursor:pointer;background:rgba(255,255,255,.04);border:1.5px solid var(--border);text-align:center;transition:all .15s}
.pip-item:hover{border-color:rgba(255,255,255,.2)}
.pip-item.active{border-color:var(--accent);background:rgba(99,102,241,.1)}
.pip-item svg{width:28px;height:28px;fill:var(--text-secondary);margin-bottom:4px}
.pip-item span{display:block;font-size:10px;color:var(--text-secondary)}

/* ===== Slide Panel (Portrait) ===== */
.slide-panel{position:fixed;top:0;right:0;bottom:0;width:85%;max-width:360px;background:var(--panel);z-index:100;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:-4px 0 20px rgba(0,0,0,.5)}
.slide-panel.open{transform:translateX(0)}
.slide-panel .panel-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border)}
.slide-panel .panel-header h3{font-size:14px;font-weight:600}
.slide-panel .panel-close{background:none;border:none;color:var(--text-primary);cursor:pointer;padding:4px;border-radius:4px}
.slide-panel .panel-close svg{width:20px;height:20px;fill:currentColor}
.slide-panel .panel-body{flex:1;overflow-y:auto;padding:14px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.show{opacity:1;pointer-events:auto}

/* ===== AI Sheet ===== */
.ai-sheet{position:fixed;left:0;right:0;bottom:0;max-height:80vh;background:var(--panel);z-index:100;border-radius:16px 16px 0 0;transform:translateY(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);overflow:hidden;display:flex;flex-direction:column}
.ai-sheet.open{transform:translateY(0)}
.ai-sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--handle);margin:8px auto 4px;flex-shrink:0}
.ai-sheet-header{padding:8px 16px 12px;display:flex;align-items:center;justify-content:space-between}
.ai-sheet-header h3{font-size:16px;font-weight:700}
.ai-sheet-body{flex:1;overflow-y:auto;padding:0 16px 20px}
.ai-card{display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;background:rgba(255,255,255,.04);margin-bottom:10px;cursor:pointer;transition:background .15s}
.ai-card:hover{background:rgba(255,255,255,.07)}
.ai-card .ai-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px}
.ai-card .ai-info{flex:1;min-width:0}
.ai-card .ai-info h4{font-size:13px;font-weight:600;margin-bottom:2px;display:flex;align-items:center;gap:4px}
.ai-card .ai-info p{font-size:11px;color:var(--text-secondary);line-height:1.4}
.ai-card .ai-use{padding:6px 14px;border-radius:6px;background:var(--accent);color:#fff;border:none;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0}
.ai-card .ai-use.locked{background:var(--handle);color:var(--text-secondary)}
.ai-card .lock-icon{width:12px;height:12px;fill:var(--text-secondary)}

/* ===== Export Modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal{background:var(--panel);border-radius:16px;width:90%;max-width:380px;padding:24px;transform:scale(.9);transition:transform .25s}
.modal-overlay.show .modal{transform:scale(1)}
.modal h3{font-size:16px;font-weight:700;margin-bottom:16px;text-align:center}
.modal-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.modal-row label{font-size:13px;color:var(--text-secondary)}
.modal-row select,.modal-row input[type=number]{background:var(--handle);border:1px solid var(--border);color:var(--text-primary);padding:6px 10px;border-radius:6px;font-size:12px}
.modal-row select{min-width:120px}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.modal-actions button{flex:1;padding:10px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s}
.modal-actions .cancel{background:var(--handle);color:var(--text-primary)}
.modal-actions .confirm{background:var(--accent);color:#fff}
.modal-actions .confirm:hover{background:#5558e6}

/* VIP Modal */
.vip-modal .vip-badge{text-align:center;margin-bottom:12px}
.vip-modal .vip-badge span{display:inline-block;padding:4px 12px;border-radius:20px;background:linear-gradient(135deg,#F59E0B,#EF4444);font-size:12px;font-weight:700;color:#fff}
.vip-modal .vip-features{margin:12px 0;font-size:12px;color:var(--text-secondary);line-height:1.8}
.vip-modal .vip-price{text-align:center;margin:16px 0}
.vip-modal .vip-price .amount{font-size:32px;font-weight:800;color:var(--accent)}
.vip-modal .vip-price .period{font-size:13px;color:var(--text-secondary)}

/* Toast */
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-20px);background:rgba(255,255,255,.95);color:#121216;padding:8px 20px;border-radius:8px;font-size:13px;font-weight:500;z-index:300;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== Portrait Mode ===== */
.editor.portrait .main-area{flex-direction:column}
.editor.portrait .preview-panel{width:100%!important;min-width:0;max-width:none;aspect-ratio:16/9;flex-shrink:0}
.editor.portrait .resize-handle{display:none}
.editor.portrait .tool-panel{display:none}
.editor.portrait .timeline-area{flex:1;min-height:120px}

/* Settings dropdown */
.settings-menu{position:absolute;top:44px;right:12px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:4px;z-index:50;min-width:160px;box-shadow:0 8px 24px rgba(0,0,0,.4);display:none}
.settings-menu.show{display:block}
.settings-menu button{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;background:none;border:none;color:var(--text-primary);font-size:12px;cursor:pointer;border-radius:6px;text-align:left}
.settings-menu button:hover{background:rgba(255,255,255,.08)}

/* Crop overlay in preview */
.crop-overlay{position:absolute;inset:10%;border:2px dashed rgba(255,255,255,.5);display:none;pointer-events:none}
.crop-overlay.show{display:block}
.crop-corner{position:absolute;width:12px;height:12px;border:2px solid #fff;background:var(--accent)}

/* Animations */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.recording{animation:pulse 1s infinite}
</style>
</head>
<body>

<div class="editor" id="editor">
  <!-- Title Bar -->
  <div class="title-bar">
    <div class="left">
      <button class="tb-btn" onclick="showToast('返回项目列表')" title="返回">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
    </div>
    <div class="center" id="projectName">我的项目</div>
    <div class="right">
      <button class="tb-btn" id="settingsBtn" onclick="toggleSettings()" title="设置">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1112 8.4a3.6 3.6 0 010 7.2z"/></svg>
      </button>
      <button class="tb-btn primary" onclick="showExportModal()" title="导出">
        <svg viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        导出
      </button>
    </div>
    <div class="settings-menu" id="settingsMenu">
      <button onclick="showToast('项目设置');toggleSettings()">项目设置</button>
      <button onclick="showToast('画面比例');toggleSettings()">画面比例</button>
      <button onclick="showToast('帧率设置');toggleSettings()">帧率设置</button>
      <button onclick="showToast('渲染质量');toggleSettings()">渲染质量</button>
    </div>
  </div>

  <!-- Main Area -->
  <div class="main-area" id="mainArea">
    <!-- Preview Panel -->
    <div class="preview-panel" id="previewPanel" style="width:55%">

<script>

  { id:'adjust', name:'调整', icon:'M12 3v1m0 16v1m9-9h-1M4 12H3m15.36 6.36l-.7-.7M6.34 6.34l-.7-.7m12.72 0l-.7.7M6.34 17.66l-.7.7M16 12a4 4 0 11-8 0 4 4 0 018 0z' },
  { id:'volume', name:'音量', icon:'M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z' },
  { id:'text', name:'文本', icon:'M5 4v3h5.5v12h3V7H19V4z' },
  { id:'effect', name:'特效', icon:'M7 2v11h3v9l7-12h-4l4-8z' },
  { id:'ratio', name:'比例', icon:'M3 5v4h2V5h4V3H5a2 2 0 00-2 2zm14-2h-4v2h4v4h2V5a2 2 0 00-2-2zm0 16h-4v2h4a2 2 0 002-2v-4h-2v4zM3 17a2 2 0 002 2h4v-2H5v-4H3v4z' },
  { id:'pip', name:'画中画', icon:'M19 7h-8v6h8V7zm2-4H3a2 2 0 00-2 2v14a2 2 0 002 2h18a2 2 0 002-2V5a2 2 0 00-2-2zm0 16H3V5h18v14z' },
  { id:'speed', name:'时长', icon:'M10 8v8l6-4-6-4zM6.3 5L5 6.3 6.3 5zM2 12l1.2 1.8L2 12zm4.3 7L5 17.7 6.3 19zM12 22l1.8-1.2L12 22zm5.7-3L19 17.7 17.7 19zM22 12l-1.2-1.8L22 12zm-4.3-7L19 6.3 17.7 5zM12 2l-1.8 1.2L12 2z' },
  { id:'more', name:'更多', icon:'M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z' }
];

// ===== Tracks Definition =====
const tracks = [
  { id:'v1', name:'视频1', icon:'🎬', type:'video', clips:[

];

const aiFeatures = [
  { id:'cutout', name:'AI抠图', desc:'智能分离主体与背景', icon:'✂️', color:'#6366F1', vip:false },

// ===== Init =====
function init() {
  checkOrientation();
  window.addEventListener('resize', checkOrientation);
  buildToolbar();
  buildTracks();
  buildAISheet();
  renderToolPanel();
  drawRuler();
  updatePlayhead();
  initResizeHandle();
  initTimelineGestures();
  initPlayheadDrag();
  initAISheetDrag();
  updateUndoRedoState();
}

// ===== Orientation =====
function checkOrientation() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const wasPortrait = state.isPortrait;
  state.isPortrait = h > w * 1.2;
  const editor = document.getElementById('editor');
  if (state.isPortrait) {
    editor.classList.add('portrait');
  } else {
    editor.classList.remove('portrait');
    const pp = document.getElementById('previewPanel');
    pp.style.width = (state.panelRatio * 100) + '%';
  }
}

// ===== Toolbar =====
function buildToolbar() {
  const tb = document.getElementById('toolbar');
  tb.innerHTML = tools.map(t => `
    <button class="tool-btn${t.id===state.activeTool?' active':''}" data-tool="${t.id}" onclick="selectTool('${t.id}')">
      <svg viewBox="0 0 24 24"><path d="${t.icon}"/></svg>
      <span>${t.name}</span>
    </button>
  `).join('');
}

function selectTool(id) {
  state.activeTool = id;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.toggle('active', b.dataset.tool === id));
  const t = tools.find(x => x.id === id);
  document.getElementById('toolPanelTitle').textContent = t ? t.name : '';
  document.getElementById('slidePanelTitle').textContent = t ? t.name : '';
  renderToolPanel();
  if (state.isPortrait) {
    openSlidePanel();
  }
  // Special: show crop overlay
  document.getElementById('cropOverlay').classList.toggle('show', id === 'crop');
}

// ===== Tool Panel Content =====
function renderToolPanel() {
  const html = getToolContent(state.activeTool);
  document.getElementById('toolPanelContent').innerHTML = html;
  document.getElementById('slidePanelBody').innerHTML = html;
  bindToolEvents();
}

function getToolContent(id) {
  switch(id) {
    case 'split': return `
      <div class="tool-section">
        <div class="tool-section-title">分割点</div>

        <button class="tb-btn primary" style="width:100%;justify-content:center;padding:10px" onclick="doSplit()">
          <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:#fff"><path d="M7 5a2 2 0 00-2 2v2H3v2h2v2a2 2 0 002 2h2v2h2v-2h2a2 2 0 002-2v-2h2v-2h-2V7a2 2 0 00-2-2h-2V3h-2v2H7z"/></svg>

      <div class="tool-section">

    case 'crop': return `

          </div>
          <div class="ratio-item" onclick="selectRatio(this,'9:16')">
            <div class="ratio-box" style="width:20px;height:36px">9:16</div><span>9:16</span>
          </div>
          <div class="ratio-item" onclick="selectRatio(this,'1:1')">
            <div class="ratio-box" style="width:28px;height:28px">1:1</div><span>1:1</span>
          </div>
        </div>
      </div>
      <div class="tool-section">
        <div class="tool-section-title">旋转</div>
        <div class="slider-group">
          <div class="slider-label"><span>旋转角度</span><span class="val">0°</span></div>

function bindToolEvents() {}

// ===== Track Building =====
function buildTracks() {
  const labels = document.getElementById('trackLabels');
  const container = document.getElementById('tracksContainer');
  labels.innerHTML = tracks.map(t => `
    <div class="track-label">
      <span class="track-icon">${t.icon}</span>
      <span class="track-name">${t.name}</span>
      <span class="track-actions">
        <button title="可见" onclick="toggleTrackVisibility(this)" class="active">👁</button>
        <button title="锁定" onclick="toggleTrackLock(this)">🔓</button>
        ${t.type==='audio'?'<button title="静音" onclick="toggleTrackMute(this)">🔊</button>':''}
      </span>
    </div>
  `).join('');
  container.innerHTML = tracks.map(t => `
    <div class="track-row" data-track="${t.id}">
      ${t.clips.map(c => `<div class="clip ${c.color}" data-clip="${c.id}" style="left:${c.start*8}px;width:${(c.end-c.start)*8}px" onclick="selectClip(this,'${c.id}')"><span class="clip-name">${c.name}</span></div>`).join('')}
    </div>
  `).join('');
  updateTimelineScale();
}

function updateTimelineScale() {
  const scroll = document.getElementById('timelineScroll');
  const baseWidth = state.totalDuration * 8;
  const w = baseWidth * state.zoom;
  scroll.style.width = w + 'px';
  scroll.style.transform = `translateX(${-state.panX}px)`;
  // Update clip positions
  tracks.forEach(t => {
    t.clips.forEach(c => {
      const el = document.querySelector(`[data-clip="${c.id}"]`);
      if (el) {
        el.style.left = (c.start * 8 * state.zoom) + 'px';
        el.style.width = ((c.end - c.start) * 8 * state.zoom) + 'px';
      }
    });
  });
  drawRuler();
  updatePlayhead();
}

// ===== Ruler =====
function drawRuler() {
  const canvas = document.getElementById('rulerCanvas');
  const container = document.getElementById('timelineScroll');
  const w = container.offsetWidth;
  const h = 22;
  canvas.width = w * devicePixelRatio;
  canvas.height = h * devicePixelRatio;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(devicePixelRatio, devicePixelRatio);
  ctx.clearRect(0, 0, w, h);

  const pxPerSec = 8 * state.zoom;
  const step = state.zoom < 0.5 ? 10 : state.zoom < 1 ? 5 : state.zoom < 2 ? 2 : 1;
  const subStep = state.zoom < 0.5 ? 5 : state.zoom < 1 ? 1 : state.zoom < 2 ? 0.5 : 0.25;

  ctx.fillStyle = '#6A6A74';
  ctx.font = '9px sans-serif';
  for (let s = 0; s <= state.totalDuration; s += step) {
    const x = s * pxPerSec;
    ctx.fillStyle = '#6A6A74';
    ctx.fillText(formatTime(s), x + 4, 12);
    ctx.fillStyle = '#3A3A3C';
    ctx.fillRect(x, 16, 1, 6);
  }
  for (let s = 0; s <= state.totalDuration; s += subStep) {
    const x = s * pxPerSec;
    ctx.fillStyle = '#2A2A2E';
    ctx.fillRect(x, 19, 1, 3);
  }
}

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + String(sec).padStart(2, '0');
}

function formatTimeFull(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  const ms = Math.floor((s % 1) * 100);
  return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0') + '.' + String(ms).padStart(2, '0');
}

// ===== Playhead =====
function updatePlayhead() {
  const ph = document.getElementById('playhead');
  const pxPerSec = 8 * state.zoom;
  ph.style.left = (state.currentTime * pxPerSec) + 'px';
  document.getElementById('previewTime').textContent = formatTimeFull(state.currentTime) + ' / ' + formatTimeFull(state.totalDuration);
}

// ===== Resize Handle =====
function initResizeHandle() {
  const handle = document.getElementById('resizeHandle');
  let dragging = false;
  let startX = 0;
  let startWidth = 0;

  handle.addEventListener('mousedown', e => {
    if (state.isPortrait) return;
    dragging = true;
    startX = e.clientX;
    startWidth = document.getElementById('previewPanel').offsetWidth;
    handle.classList.add('active');
    e.preventDefault();
  });

  handle.addEventListener('dblclick', () => {
    state.panelRatio = 0.5;
    document.getElementById('previewPanel').style.width = '50%';
  });

  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const mainWidth = document.getElementById('mainArea').offsetWidth;
    const newWidth = Math.max(mainWidth * 0.2, Math.min(mainWidth * 0.8, startWidth + e.clientX - startX));
    state.panelRatio = newWidth / mainWidth;
    document.getElementById('previewPanel').style.width = newWidth + 'px';
  });

  document.addEventListener('mouseup', () => {
    if (dragging) {
      dragging = false;
      handle.classList.remove('active');
    }
  });

  // Touch support
  handle.addEventListener('touchstart', e => {
    if (state.isPortrait || e.touches.length !== 1) return;
    dragging = true;
    startX = e.touches[0].clientX;
    startWidth = document.getElementById('previewPanel').offsetWidth;
    handle.classList.add('active');
    e.preventDefault();
  }, { passive: false });

  document.addEventListener('touchmove', e => {
    if (!dragging) return;
    const mainWidth = document.getElementById('mainArea').offsetWidth;
    const newWidth = Math.max(mainWidth * 0.2, Math.min(mainWidth * 0.8, startWidth + e.touches[0].clientX - startX));
    state.panelRatio = newWidth / mainWidth;
    document.getElementById('previewPanel').style.width = newWidth + 'px';
  }, { passive: false });

  document.addEventListener('touchend', () => {
    if (dragging) {
      dragging = false;
      handle.classList.remove('active');
    }
  });
}

// ===== Timeline Gestures (Pinch Zoom + Pan) =====
function initTimelineGestures() {
  const el = document.getElementById('timelineTracks');
  let initialDistance = 0;
  let initialZoom = 1;
  let pinchCenter = 0;
  let isPanning = false;
  let panStartX = 0;
  let panStartPanX = 0;

  el.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      // Pinch start
      initialDistance = getDistance(e.touches[0], e.touches[1]);
      initialZoom = state.zoom;
      const rect = el.getBoundingClientRect();
      pinchCenter = ((e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left + state.panX) / (8 * state.zoom);
      e.preventDefault();
    } else if (e.touches.length === 1) {
      isPanning = true;
      panStartX = e.touches[0].clientX;
      panStartPanX = state.panX;
    }
  }, { passive: false });

  el.addEventListener('touchmove', e => {
    if (e.touches.length === 2) {
      const dist = getDistance(e.touches[0], e.touches[1]);
      const scale = dist / initialDistance;
      const newZoom = Math.max(0.2, Math.min(5, initialZoom * scale));
      const pxPerSec = 8 * newZoom;
      const newPanX = pinchCenter * pxPerSec - ((e.touches[0].clientX + e.touches[1].clientX) / 2 - el.getBoundingClientRect().left);
      state.zoom = newZoom;
      state.panX = Math.max(0, newPanX);
      document.getElementById('zoomInfo').textContent = state.zoom.toFixed(1) + 'x';
      updateTimelineScale();
      e.preventDefault();
    } else if (e.touches.length === 1 && isPanning) {
      const dx = panStartX - e.touches[0].clientX;
      state.panX = Math.max(0, panStartPanX + dx);
      updateTimelineScale();
    }
  }, { passive: false });

  el.addEventListener('touchend', e => {
    if (e.touches.length < 2) {
      initialDistance = 0;
    }
    if (e.touches.length === 0) {
      isPanning = false;
    }
  });

  // Mouse wheel zoom
  el.addEventListener('wheel', e => {
    e.preventDefault();
    const rect = el.getBoundingClientRect();
    const mouseX = e.clientX - rect.left + state.panX;
    const mouseTime = mouseX / (8 * state.zoom);
    const delta = e.deltaY > 0 ? 0.9 : 1.1;
    const newZoom = Math.max(0.2, Math.min(5, state.zoom * delta));
    const pxPerSec = 8 * newZoom;
    state.panX = Math.max(0, mouseTime * pxPerSec - (e.clientX - rect.left));
    state.zoom = newZoom;
    document.getElementById('zoomInfo').textContent = state.zoom.toFixed(1) + 'x';
    updateTimelineScale();
  }, { passive: false });

  // Mouse drag pan
  let mousePanning = false;
  let mousePanStartX = 0;
  let mousePanStartPanX = 0;

  el.addEventListener('mousedown', e => {
    if (e.target.closest('.clip') || e.target.closest('.playhead')) return;
    mousePanning = true;
    mousePanStartX = e.clientX;
    mousePanStartPanX = state.panX;
    el.style.cursor = 'grabbing';
    e.preventDefault();
  });

  document.addEventListener('mousemove', e => {
    if (!mousePanning) return;
    const dx = mousePanStartX - e.clientX;
    state.panX = Math.max(0, mousePanStartPanX + dx);
    updateTimelineScale();
  });

  document.addEventListener('mouseup', () => {
    if (mousePanning) {
      mousePanning = false;
      el.style.cursor = '';
    }
  });
}

function getDistance(t1, t2) {
  const dx = t1.clientX - t2.clientX;
  const dy = t1.clientY - t2.clientY;
  return Math.sqrt(dx * dx + dy * dy);
}

// ===== Playhead Drag =====
function initPlayheadDrag() {
  const ph = document.getElementById('playhead');
  const tracks = document.getElementById('timelineTracks');
  let dragging = false;

  ph.addEventListener('mousedown', e => { dragging = true; e.preventDefault(); e.stopPropagation(); });
  ph.addEventListener('touchstart', e => { dragging = true; e.stopPropagation(); }, { passive: true });

  function moveHandler(clientX) {
    const rect = tracks.getBoundingClientRect();
    const x = clientX - rect.left + state.panX;
    const pxPerSec = 8 * state.zoom;
    state.currentTime = Math.max(0, Math.min(state.totalDuration, x / pxPerSec));
    updatePlayhead();
  }

  document.addEventListener('mousemove', e => { if (dragging) moveHandler(e.clientX); });
  document.addEventListener('touchmove', e => { if (dragging) moveHandler(e.touches[0].clientX); }, { passive: true });
  document.addEventListener('mouseup', () => { dragging = false; });
  document.addEventListener('touchend', () => { dragging = false; });

  // Click on ruler to move playhead
  document.getElementById('timeRuler').addEventListener('mousedown', e => {
    const rect = tracks.getBoundingClientRect();
    const x = e.clientX - rect.left + state.panX;
    const pxPerSec = 8 * state.zoom;
    state.currentTime = Math.max(0, Math.min(state.totalDuration, x / pxPerSec));
    updatePlayhead();
  });
}

// ===== Clip Selection =====
function selectClip(el, id) {
  document.querySelectorAll('.clip.selected').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  state.selectedClip = id;
  showToast('选中: ' + el.querySelector('.clip-name').textContent);
}

// ===== Track Controls =====
function toggleTrackVisibility(btn) {
  btn.classList.toggle('active');
  const visible = btn.classList.contains('active');
  btn.textContent = visible ? '👁' : '🚫';
  showToast(visible ? '轨道可见' : '轨道隐藏');
}

function toggleTrackLock(btn) {
  const locked = btn.textContent === '🔒';
  btn.textContent = locked ? '🔓' : '🔒';
  btn.classList.toggle('active', !locked);
  showToast(locked ? '轨道解锁' : '轨道锁定');
}

function toggleTrackMute(btn) {
  const muted = btn.textContent === '🔇';
  btn.textContent = muted ? '🔊' : '🔇';
  btn.classList.toggle('muted', !muted);
  showToast(muted ? '取消静音' : '已静音');
}

// ===== Playback =====
let playInterval = null;

function togglePlay() {
  state.isPlaying = !state.isPlaying;
  const icon = document.getElementById('playIcon');
  if (state.isPlaying) {
    icon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
    playInterval = setInterval(() => {
      state.currentTime += 0.05;
      if (state.currentTime >= state.totalDuration) {
        state.currentTime = 0;
      }
      updatePlayhead();
      // Auto scroll
      const tracks = document.getElementById('timelineTracks');
      const pxPerSec = 8 * state.zoom;
      const phX = state.currentTime * pxPerSec - state.panX;
      if (phX > tracks.offsetWidth - 40) {
        state.panX += 40;
        updateTimelineScale();
      }
    }, 50);
  } else {
    icon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    clearInterval(playInterval);
  }
}

function skipBack() {
  state.currentTime = Math.max(0, state.currentTime - 1/30);
  updatePlayhead();
}

function skipForward() {
  state.currentTime = Math.min(state.totalDuration, state.currentTime + 1/30);
  updatePlayhead();
}

// ===== Undo/Redo =====
function doUndo() {
  if (state.undoStack.length === 0) return;
  state.redoStack.push(state.undoStack.pop());
  showToast('撤销');
  updateUndoRedoState();
}

function doRedo() {
  if (state.redoStack.length === 0) return;
  state.undoStack.push(state.redoStack.pop());
  showToast('重做');
  updateUndoRedoState();
}

function updateUndoRedoState() {
  document.getElementById('undoBtn').classList.toggle('disabled', state.undoStack.length === 0);
  document.getElementById('redoBtn').classList.toggle('disabled', state.redoStack.length === 0);
}

// ===== Tool Actions =====
function doSplit() {
  state.undoStack.push({ type: 'split', time: state.currentTime });
  showToast('已在 ' + formatTimeFull(state.currentTime) + ' 处分割');
}

function selectFilter(el) {
  el.parentElement.querySelectorAll('.filter-item').forEach(f => f.classList.remove('active'));
  el.classList.add('active');

// ===== AI Sheet =====
function buildAISheet() {
  const body = document.getElementById('aiSheetBody');
  body.innerHTML = aiFeatures.map(f => `
    <div class="ai-card" onclick="useAIFeature('${f.id}', ${f.vip})">
      <div class="ai-icon" style="background:${f.color}22;color:${f.color}">${f.icon}</div>
      <div class="ai-info">
        <h4>${f.name}${f.vip ? ' <svg class="lock-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>' : ''}</h4>
        <p>${f.desc}</p>
      </div>
      <button class="ai-use${f.vip && !state.isVip ? ' locked' : ''}">${f.vip && !state.isVip ? 'VIP' : '使用'}</button>
    </div>
  `).join('');
}

function showAISheet() {
  document.getElementById('aiSheet').classList.add('open');
  document.getElementById('aiOverlay').classList.add('show');
}

function closeAISheet() {
  document.getElementById('aiSheet').classList.remove('open');
  document.getElementById('aiOverlay').classList.remove('show');
}

function useAIFeature(id, isVip) {
  if (isVip && !state.isVip) {
    closeAISheet();
    setTimeout(() => showVIPModal(), 300);
    return;
  }
  const f = aiFeatures.find(a => a.id === id);
  showToast('正在使用: ' + f.name);
  closeAISheet();
}

// AI Sheet drag to close
function initAISheetDrag() {
  const sheet = document.getElementById('aiSheet');
  const handle = document.getElementById('aiSheetHandle');
  let startY = 0;
  let currentY = 0;
  let dragging = false;

  handle.addEventListener('touchstart', e => {
    dragging = true;
    startY = e.touches[0].clientY;
    sheet.style.transition = 'none';
  }, { passive: true });

  document.addEventListener('touchmove', e => {
    if (!dragging) return;
    currentY = e.touches[0].clientY - startY;
    if (currentY > 0) {
      sheet.style.transform = `translateY(${currentY}px)`;
    }
  }, { passive: true });

  document.addEventListener('touchend', () => {
    if (!dragging) return;
    dragging = false;
    sheet.style.transition = '';
    if (currentY > 80) {
      closeAISheet();
    } else {
      sheet.style.transform = '';
      if (sheet.classList.contains('open')) {
        sheet.style.transform = 'translateY(0)';
      }
    }
    currentY = 0;
  });
}

function toggleSettings() {
  document.getElementById('settingsMenu').classList.toggle('show');
}

document.addEventListener('click', e => {
  const menu = document.getElementById('settingsMenu');
  if (menu.classList.contains('show') && !e.target.closest('#settingsBtn') && !e.target.closest('.settings-menu')) {
    menu.classList.remove('show');
  }
});

// ===== Toast =====
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

// ===== Init =====
document.addEventListener('DOMContentLoaded', init);
</script>
