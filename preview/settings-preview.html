<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexClip 设置页面预览</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0a; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: -apple-system, 'SF Pro Text', 'PingFang SC', sans-serif; }

.phone {
  width: 390px; height: 844px; background: #080808; border-radius: 44px;
  border: 3px solid #2a2a2a; overflow: hidden; position: relative;
  box-shadow: 0 0 60px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.04);
}

/* Status bar */
.status-bar {
  height: 54px; display: flex; align-items: flex-end; justify-content: space-between;
  padding: 0 28px 8px; color: #F0ECE4; font-size: 14px; font-weight: 600;
}
.status-bar .time { font-size: 15px; font-weight: 700; }
.status-bar .icons { display: flex; gap: 6px; align-items: center; font-size: 12px; }

/* Content */
.content {
  height: calc(100% - 54px); overflow-y: auto; padding: 0 12px 20px;
  scrollbar-width: none;
}
.content::-webkit-scrollbar { display: none; }

/* Top bar */
.top-bar {
  display: flex; align-items: center; height: 52px; padding: 0 0; margin-bottom: 4px;
}
.back-btn {
  width: 32px; height: 32px; background: #161616; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: #B0ACA4; font-size: 20px; cursor: pointer; border: none;
  transition: background 0.2s;
}
.back-btn:hover { background: #1e1e1e; }
.top-bar h1 {
  font-size: 18px; font-weight: 700; color: #F0ECE4; margin-left: 12px;
}

/* Section header */
.section-header {
  font-size: 11px; color: #6A6660; letter-spacing: 1px; font-weight: 600;
  padding: 16px 6px 6px 6px; text-transform: uppercase;
}

/* Settings card */
.card {
  background: #161616; border-radius: 12px; padding: 2px; margin-bottom: 4px;
}

/* Setting row */
.setting-row {
  display: flex; align-items: center; padding: 12px 14px; cursor: pointer;
  transition: background 0.15s; border-radius: 10px;
}
.setting-row:hover { background: rgba(255,255,255,0.02); }
.setting-row .title {
  font-size: 12px; font-weight: 500; color: #F0ECE4; flex: 1;
}
.setting-row .value {
  font-size: 10px; color: #B0ACA4; font-family: 'SF Mono', 'Menlo', monospace;
  background: #1E1E1E; padding: 2px 6px; border-radius: 4px;
}
.setting-row .arrow {
  font-size: 16px; color: #6A6660; margin-left: 6px;
}

/* Divider */
.divider {
  height: 0.5px; background: #1A1A1A; margin: 0 14px;
}

/* Toggle */
.toggle-row {
  display: flex; align-items: center; padding: 12px 14px;
}
.toggle-row .title {
  font-size: 12px; font-weight: 500; color: #F0ECE4; flex: 1;
}
.toggle {
  width: 44px; height: 24px; border-radius: 12px; position: relative;
  cursor: pointer; transition: background 0.3s;
}
.toggle.on { background: #4A90D9; }
.toggle.off { background: #3A3A3A; }
.toggle .knob {
  width: 20px; height: 20px; border-radius: 10px; background: white;
  position: absolute; top: 2px; transition: left 0.3s;
}
.toggle.on .knob { left: 22px; }
.toggle.off .knob { left: 2px; }

/* Cache row with button */
.cache-row {
  display: flex; align-items: center; padding: 12px 14px; cursor: pointer;
}
.cache-row .info { flex: 1; }
.cache-row .info .title { font-size: 12px; font-weight: 500; color: #F0ECE4; }
.cache-row .info .subtitle { font-size: 9px; color: #6A6660; margin-top: 2px; }
.clear-btn {
  font-size: 10px; color: #E84848; font-weight: 500;
  background: rgba(232,72,72,0.12); padding: 5px 10px; border-radius: 6px;
  border: none; cursor: pointer; transition: background 0.2s;
}
.clear-btn:hover { background: rgba(232,72,72,0.2); }
.manage-btn {
  font-size: 10px; color: #4A90D9; font-weight: 500;
  background: rgba(74,144,217,0.12); padding: 5px 10px; border-radius: 6px;
  border: none; cursor: pointer; transition: background 0.2s;
}
.manage-btn:hover { background: rgba(74,144,217,0.2); }

/* Quality selector */
.quality-row {
  display: flex; align-items: center; padding: 12px 14px;
}
.quality-row .title { font-size: 12px; font-weight: 500; color: #F0ECE4; flex: 1; }
.quality-options { display: flex; gap: 4px; }
.quality-opt {
  font-size: 10px; padding: 4px 10px; border-radius: 6px;
  cursor: pointer; transition: all 0.2s; border: 1px solid transparent;
}
.quality-opt.sel {
  color: #4A90D9; background: rgba(74,144,217,0.15);
  border-color: #4A90D9; font-weight: 600;
}
.quality-opt:not(.sel) {
  color: #6A6660; background: #1E1E1E;
}

/* Footer */
.footer {
  text-align: center; font-size: 9px; color: #6A6660;
  padding: 16px 0 8px;
}

/* Confirm dialog */
.dialog-overlay {
  position: absolute; inset: 0; background: rgba(0,0,0,0.6);
  display: none; align-items: center; justify-content: center; z-index: 10;
}
.dialog-overlay.show { display: flex; }
.dialog {
  background: #1E1E1E; border-radius: 16px; padding: 24px; width: 280px;
  text-align: center;
}
.dialog h3 { font-size: 16px; color: #F0ECE4; font-weight: 700; margin-bottom: 8px; }
.dialog p { font-size: 12px; color: #B0ACA4; line-height: 1.5; margin-bottom: 20px; }
.dialog-btns { display: flex; gap: 10px; }
.dialog-btns button {
  flex: 1; padding: 10px; border-radius: 10px; border: none;
  font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity 0.2s;
}
.dialog-btns button:hover { opacity: 0.85; }
.btn-cancel { background: #2C2C2C; color: #B0ACA4; }
.btn-confirm { background: #E84848; color: white; }
</style>
</head>
<body>

<div class="phone">
  <!-- Status bar -->
  <div class="status-bar">
    <span class="time">9:41</span>
    <span class="icons">
      <svg width="16" height="12" viewBox="0 0 16 12"><rect x="0" y="5" width="3" height="7" rx="0.5" fill="#F0ECE4"/><rect x="4.5" y="3" width="3" height="9" rx="0.5" fill="#F0ECE4"/><rect x="9" y="1" width="3" height="11" rx="0.5" fill="#F0ECE4"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#F0ECE4" opacity="0.3"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 3C5.5 3 3.3 4 1.8 5.6L0.4 4.2C2.3 2.2 5 1 8 1s5.7 1.2 7.6 3.2l-1.4 1.4C12.7 4 10.5 3 8 3z" fill="#F0ECE4" opacity="0.3"/><path d="M8 6c-1.7 0-3.2.7-4.3 1.8L2.3 6.4C3.8 4.9 5.8 4 8 4s4.2.9 5.7 2.4l-1.4 1.4C11.2 6.7 9.7 6 8 6z" fill="#F0ECE4" opacity="0.3"/><path d="M8 9c-0.8 0-1.6.3-2.1.9L4.5 8.5C5.5 7.6 6.7 7 8 7s2.5.6 3.5 1.5l-1.4 1.4C9.6 9.3 8.8 9 8 9z" fill="#F0ECE4"/><circle cx="8" cy="11" r="1.2" fill="#F0ECE4"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0" y="1" width="21" height="10" rx="2" stroke="#F0ECE4" stroke-width="1" fill="none"/><rect x="22" y="4" width="2" height="4" rx="0.5" fill="#F0ECE4" opacity="0.4"/><rect x="1.5" y="2.5" width="14" height="7" rx="1" fill="#6EC850"/></svg>
    </span>
  </div>

  <!-- Content -->
  <div class="content">
    <!-- Top bar -->
    <div class="top-bar">
      <button class="back-btn">‹</button>
      <h1>设置</h1>
    </div>

    <!-- 通用 -->
    <div class="section-header">通用</div>
    <div class="card">
      <div class="setting-row">
        <span class="title">默认分辨率</span>
        <span class="value">1080p</span>
        <span class="arrow">›</span>
      </div>
      <div class="divider"></div>
      <div class="setting-row">
        <span class="title">默认帧率</span>
        <span class="value">30</span>
        <span class="arrow">›</span>
      </div>
      <div class="divider"></div>
      <div class="setting-row">
        <span class="title">自动保存间隔</span>
        <span class="value">30秒</span>
        <span class="arrow">›</span>
      </div>
      <div class="divider"></div>
      <div class="setting-row">
        <span class="title">语言</span>
        <span class="value">中文</span>
        <span class="arrow">›</span>
      </div>
    </div>

    <!-- 存储 -->
    <div class="section-header">存储</div>
    <div class="card">
      <div class="cache-row" id="cacheRow">
        <div class="info">
          <div class="title">缓存大小</div>
          <div class="subtitle" id="cacheSize">128 MB</div>
        </div>
        <button class="clear-btn" onclick="clearCache()">清除缓存</button>
      </div>
      <div class="divider"></div>
      <div class="cache-row">
        <div class="info">
          <div class="title">模型管理</div>
          <div class="subtitle">AI 模型总大小: 2.4 GB</div>
        </div>
        <button class="manage-btn">管理</button>
      </div>
      <div class="divider"></div>
      <div class="setting-row">
        <span class="title">导出目录</span>
        <span class="value">/内部存储/NexClip</span>
        <span class="arrow">›</span>
      </div>
    </div>

    <!-- 性能 -->
    <div class="section-header">性能</div>
    <div class="card">
      <div class="toggle-row">
        <span class="title">硬件加速</span>
        <div class="toggle on" onclick="toggleSwitch(this)"><div class="knob"></div></div>
      </div>
      <div class="divider"></div>
      <div class="quality-row">
        <span class="title">预览质量</span>
        <div class="quality-options">
          <div class="quality-opt" onclick="selectQuality(this)">低</div>
          <div class="quality-opt sel" onclick="selectQuality(this)">中</div>
          <div class="quality-opt" onclick="selectQuality(this)">高</div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="toggle-row">
        <span class="title">后台渲染</span>
        <div class="toggle off" onclick="toggleSwitch(this)"><div class="knob"></div></div>
      </div>
    </div>

    <!-- 关于 -->
    <div class="section-header">关于</div>
    <div class="card">
      <div class="setting-row">
        <span class="title">版本号</span>
        <span class="value">v1.0.0</span>
        <span class="arrow">›</span>
      </div>
      <div class="divider"></div>
      <div class="setting-row">
        <span class="title">检查更新</span>
        <span class="arrow">›</span>
      </div>
      <div class="divider"></div>
      <div class="setting-row">
        <span class="title">开源许可</span>
        <span class="arrow">›</span>
      </div>
      <div class="divider"></div>
      <div class="setting-row">
        <span class="title">隐私政策</span>
        <span class="arrow">›</span>
      </div>
      <div class="divider"></div>
      <div class="setting-row">
        <span class="title">用户协议</span>
        <span class="arrow">›</span>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">NexClip · AI 智能视频编辑器</div>
  </div>

  <!-- Confirm dialog -->
  <div class="dialog-overlay" id="dialogOverlay">
    <div class="dialog">
      <h3>清除缓存</h3>
      <p>确定要清除所有缓存数据吗？此操作不可撤销。</p>
      <div class="dialog-btns">
        <button class="btn-cancel" onclick="closeDialog()">取消</button>
        <button class="btn-confirm" onclick="confirmClear()">清除</button>
      </div>
    </div>
  </div>
</div>

<script>
function toggleSwitch(el) {
  el.classList.toggle('on');
  el.classList.toggle('off');
}

function selectQuality(el) {
  document.querySelectorAll('.quality-opt').forEach(o => o.classList.remove('sel'));
  el.classList.add('sel');
}

function clearCache() {
  document.getElementById('dialogOverlay').classList.add('show');
}

function closeDialog() {
  document.getElementById('dialogOverlay').classList.remove('show');
}

function confirmClear() {
  document.getElementById('cacheSize').textContent = '0 MB';
  closeDialog();
}
</script>
</body>
</html>
